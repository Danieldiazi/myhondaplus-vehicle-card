name: Build distribution

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/build-dist.yml"

permissions:
  contents: write

jobs:
  build-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build self-contained dashboard resource
        run: npm run build
      - name: Commit generated distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/myhondaplus-vehicle-card.js
          if git diff --cached --quiet; then
            echo "Distribution is already up to date"
          else
            git commit -m "Build dashboard distribution [skip ci]"
            git push
          fi
